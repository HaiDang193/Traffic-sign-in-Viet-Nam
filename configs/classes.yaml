# Danh sách lớp biển báo của dự án (theo QCVN 41 - Quy chuẩn báo hiệu đường bộ).
# Được dựng từ hợp các lớp của 2 dataset trong configs/datasets.yaml (xem configs/mappings/).
#
# - Thứ tự trong danh sách = class_id của YOLO. KHÔNG đổi thứ tự sau khi đã train / gán nhãn,
#   chỉ thêm lớp mới vào CUỐI danh sách.
# - `key`  : tên ngắn không dấu, dùng trong code / Roboflow / file mapping.
# - `code` : mã biển. Những dòng có "# ?" là mã chưa chắc chắn -> nhóm đối chiếu với QCVN 41:2024/BGTVT.
# - `group`: cam (P), nguy_hiem (W), hieu_lenh (R), chi_dan (I), phu (S), khac.

